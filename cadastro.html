<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#150921">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Grupo Oliveira">
  <meta name="description" content="Cadastre-se no Clube de Vantagens Grupo Oliveira e ganhe 3% de cashback e pontos em todos os seus abastecimentos.">
  <title>Criar Conta — Grupo Oliveira</title>

  <link rel="icon" type="image/png" href="./assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="./assets/img/brand/icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/auth.css?v=6">
</head>
<body class="auth-page auth-page--cadastro">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <img src="./Logotipo do aplicativo.png" alt="Grupo Oliveira" class="auth-logo" onerror="this.src='./assets/img/brand/icon-192.png'">
      </div>

      <h1 class="auth-title">Criar Conta no Clube</h1>
      <p class="auth-subtitle">Cadastro único válido em todas as 6 unidades do Grupo Oliveira</p>

      <!-- ORIGEM PRESERVADA -->
      <div id="origin-badge" class="station-origin-badge">
        <span style="font-size:18px">📍</span>
        <div style="flex:1;line-height:1.35">
          <div style="font-size:11.5px;color:#cbd5e1;font-weight:600">Unidade de Cadastro:</div>
          <b id="origin-station-name" style="color:#ffffff">Posto Oliveira Planeta Boi</b>
        </div>
      </div>

      <!-- ALERTA DE FEEDBACK -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="form-cadastro" onsubmit="handleCadastro(event)">
        <div class="form-group">
          <label for="cad-name" class="form-label">Nome Completo <span class="req-mark">*</span></label>
          <div class="input-wrapper">
            <input type="text" id="cad-name" name="name" required class="auth-input" placeholder="Ex.: Lucas Albuquerque">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cad-cpf" class="form-label">CPF <span class="req-mark">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="cad-cpf" name="cpf" required class="auth-input" placeholder="000.000.000-00" maxlength="14" oninput="maskCPF(this)">
            </div>
          </div>
          <div class="form-group">
            <label for="cad-phone" class="form-label">Celular / WhatsApp <span class="req-mark">*</span></label>
            <div class="input-wrapper">
              <input type="tel" id="cad-phone" name="phone" required class="auth-input" placeholder="(92) 99999-9999" maxlength="15" oninput="maskPhone(this)">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="cad-email" class="form-label">E-mail <span class="req-mark">*</span></label>
          <div class="input-wrapper">
            <input type="email" id="cad-email" name="email" required class="auth-input" placeholder="seuemail@exemplo.com" autocomplete="email">
          </div>
        </div>

        <!-- REQUISITO 1: CRIAR SENHA (MÍNIMO 8 CARACTERES + TOGGLE) -->
        <div class="form-group">
          <label for="cad-password" class="form-label">Criar Senha <span class="req-mark">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="cad-password" name="password" required minlength="8" class="auth-input has-toggle" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cad-password', this)" aria-label="Mostrar ou ocultar senha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-hint">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>A senha deve conter no mínimo 8 caracteres.</span>
          </div>
        </div>

        <!-- REQUISITO 1: CONFIRMAR SENHA (+ TOGGLE E VALIDAÇÃO) -->
        <div class="form-group">
          <label for="cad-confirm-password" class="form-label">Confirmar Senha <span class="req-mark">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="cad-confirm-password" name="confirmPassword" required minlength="8" class="auth-input has-toggle" placeholder="Repita a senha criada" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cad-confirm-password', this)" aria-label="Mostrar ou ocultar senha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- DADOS DO VEÍCULO (OPCIONAIS) -->
        <div class="form-row">
          <div class="form-group">
            <label for="cad-vehicle" class="form-label">Modelo do Veículo</label>
            <div class="input-wrapper">
              <input type="text" id="cad-vehicle" name="vehicle" class="auth-input" placeholder="opcional">
            </div>
          </div>
          <div class="form-group">
            <label for="cad-plate" class="form-label">Placa</label>
            <div class="input-wrapper">
              <input type="text" id="cad-plate" name="plate" class="auth-input plate-input" placeholder="opcional" maxlength="8">
            </div>
          </div>
        </div>
        <div class="field-hint field-hint--vehicle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Caso não lembre agora, pode deixar em branco e preencher depois.</span>
        </div>

        <button type="submit" id="btn-submit" class="btn-auth-submit">
          <span>CONCLUIR CADASTRO</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Já tem uma conta no Clube?
        <a href="/login">Fazer Login</a>
      </div>
    </div>
  </div>

  <!-- SUPABASE JS BUNDLE -->
  <script src="./assets/js/supabase.js"></script>

  <script>
    const STATION_NAMES = {
      'posto-planetaboi': 'Posto Oliveira Planeta Boi',
      'posto-uniao': 'Fábrica de Gelo e Posto União',
      'posto-ponte': 'Posto Oliveira Ponte',
      'posto-sham': 'Posto Oliveira Sham',
      'posto-francesa': 'Posto Oliveira Francesa',
      'posto-vilacristina': 'Posto Oliveira — Vila Cristina',
      'escritorio-central': 'Escritório Central Grupo Oliveira',
      // Aliases para compatibilidade
      'posto-01': 'Posto Oliveira — Vila Cristina',
      'matriz-parintins': 'Posto Oliveira Planeta Boi',
      'posto-02': 'Fábrica de Gelo e Posto União',
      'posto-barreirinha': 'Fábrica de Gelo e Posto União',
      'posto-03': 'Posto Oliveira Ponte',
      'posto-nhamunda': 'Posto Oliveira Ponte',
      'posto-04': 'Posto Oliveira Sham',
      'posto-terrasanta': 'Posto Oliveira Sham',
      'posto-05': 'Posto Oliveira Francesa',
      'posto-fluvial': 'Posto Oliveira Francesa',
      'posto-06': 'Posto Oliveira Planeta Boi',
      'posto-express': 'Posto Oliveira Planeta Boi'
    };

    let supabaseClient = null;
    let originStationId = 'posto-planetaboi';

    async function initSupabase() {
      try {
        const res = await fetch('/api/auth/config');
        if (res.ok) {
          const config = await res.json();
          if (config.supabaseUrl && config.supabaseAnonKey && typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            console.log('[Supabase Auth] Conectado ao projeto:', config.supabaseUrl);
          }
        }
      } catch (e) {
        console.warn('[Supabase Auth] Modo autônomo / fallback ativo:', e.message);
      }
    }

    initSupabase();

    // Identificar e exibir posto de origem
    function checkStationOrigin() {
      const urlParams = new URLSearchParams(window.location.search);
      let ref = urlParams.get('ref') || urlParams.get('r') || localStorage.getItem('go_install_origin_id');

      if (ref) {
        ref = ref.toLowerCase().trim();
        originStationId = ref;
        const stName = STATION_NAMES[ref] || 'Posto Marcos Zagury (Matriz)';
        document.getElementById('origin-station-name').textContent = stName;
        document.getElementById('origin-badge').style.display = 'flex';
      }
    }

    checkStationOrigin();

    // Máscaras de CPF e Telefone
    function maskCPF(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      input.value = v;
    }

    function maskPhone(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
      input.value = v;
    }

    // Toggle de Mostrar/Ocultar Senha
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;

      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      btn.innerHTML = isPassword
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('auth-alert');
      alertBox.className = 'auth-alert' + (type === 'success' ? ' success' : '');
      alertBox.innerHTML = message;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('auth-alert').style.display = 'none';
    }

    // Processamento do Cadastro
    async function handleCadastro(e) {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('cad-name').value.trim();
      const cpf = document.getElementById('cad-cpf').value.trim();
      const phone = document.getElementById('cad-phone').value.trim();
      const email = document.getElementById('cad-email').value.trim().toLowerCase();
      const password = document.getElementById('cad-password').value;
      const confirmPassword = document.getElementById('cad-confirm-password').value;
      const vehicle = document.getElementById('cad-vehicle').value.trim();
      const plate = document.getElementById('cad-plate').value.trim().toUpperCase();
      const submitBtn = document.getElementById('btn-submit');

      // VALIDAÇÕES OBRIGATÓRIAS
      const cleanCPF = cpf.replace(/\D/g, '');
      if (cleanCPF.length !== 11) {
        showAlert('Por favor, informe um CPF válido com 11 dígitos.');
        return;
      }

      if (password.length < 8) {
        showAlert('A senha deve conter no mínimo 8 caracteres.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('As senhas informadas não coincidem. Por favor, digite a mesma senha nos dois campos.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner"></div><span>Criando Conta Segura...</span>`;

      try {
        // Gerar número de cartão digital exclusivo
        const part1 = '4589';
        const part2 = String(Math.floor(1000 + Math.random() * 9000));
        const part3 = String(Math.floor(1000 + Math.random() * 9000));
        const part4 = String(Math.floor(1000 + Math.random() * 9000));
        const newCardNumber = `${part1} ${part2} ${part3} ${part4}`;

        // 1. Tentar cadastro oficial no Supabase Auth
        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                name: name,
                cpf: cpf,
                phone: phone,
                cardNumber: newCardNumber,
                vehicle: vehicle,
                plate: plate,
                stationId: originStationId,
                role: 'customer' // REGRA: Cadastro público cria ESTRITAMENTE customer
              }
            }
          });

          if (error) {
            // Se já cadastrado
            if (error.message && error.message.includes('already registered')) {
              throw new Error(`Este e-mail já possui cadastro. <a href="/login" style="color:#38bdf8;font-weight:bold;text-decoration:underline">Clique aqui para entrar</a>.`);
            }
            throw error;
          }
        }

        // 2. Persistir localmente no estado da aplicação
        const newClientId = 'CLI-' + Math.floor(1000 + Math.random() * 9000);
        const savedState = JSON.parse(localStorage.getItem('grupo-oliveira-fidelidade-v2') || '{}');
        savedState.clientId = newClientId;
        savedState.name = name;
        savedState.cardNumber = newCardNumber;
        savedState.vehicle = vehicle;
        savedState.plate = plate;
        savedState.balance = 0.00;
        savedState.points = 100; // Bônus de boas-vindas
        savedState.currentRole = 'customer';
        savedState.authSession = {
          authenticated: true,
          email: email,
          role: 'customer',
          name: name,
          loginAt: new Date().toISOString()
        };

        savedState.registeredClients = savedState.registeredClients || [];
        savedState.registeredClients.push({
          id: newClientId,
          name,
          cardNumber: newCardNumber,
          phone,
          email,
          cpf,
          vehicle,
          plate,
          originStationId,
          originStationName: STATION_NAMES[originStationId] || 'Posto Marcos Zagury (Matriz)',
          registeredAt: new Date().toISOString()
        });

        localStorage.setItem('grupo-oliveira-fidelidade-v2', JSON.stringify(savedState));
        localStorage.setItem('go_current_role', 'customer');

        showAlert(`🎉 Conta criada com sucesso! Redirecionando para o seu Cartão Digital...`, 'success');

        setTimeout(() => {
          window.location.href = '/?role=customer';
        }, 800);

      } catch (err) {
        console.error('[Cadastro Error]', err);
        showAlert(err.message || 'Erro ao realizar cadastro. Tente novamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>CONCLUIR CADASTRO</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>`;
      }
    }
  </script>
</body>
</html>
