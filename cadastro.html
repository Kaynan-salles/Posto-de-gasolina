<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#150921">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Grupo Oliveira">
  <meta name="description" content="Cadastre-se no Clube de Vantagens Grupo Oliveira e ganhe 3% de cashback e pontos em todos os seus abastecimentos.">
  <title>Criar Conta — Grupo Oliveira</title>

  <link rel="icon" type="image/png" href="./assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="./assets/img/brand/icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">

  <style>
    body.auth-page {
      background: radial-gradient(circle at 50% 0%, #30174c 0%, #150921 60%, #0a0312 100%);
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px;
      box-sizing: border-box;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(86, 47, 130, 0.2);
    }

    .auth-logo-wrap {
      text-align: center;
      margin-bottom: 16px;
    }

    .auth-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
      border: none;
      background: transparent;
      display: inline-block;
    }

    .auth-title {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .auth-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      margin: 0 0 20px;
    }

    /* Informação do Posto de Origem preservado */
    .station-origin-badge {
      display: none;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .auth-input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .auth-input.has-toggle {
      padding-right: 44px;
    }

    .password-toggle-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .password-toggle-btn:hover {
      color: #ffffff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .password-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-auth-submit {
      width: 100%;
      background: linear-gradient(135deg, #0082ca 0%, #562f82 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      font-family: var(--font-heading, 'Outfit', sans-serif);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(0, 130, 202, 0.35);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 130, 202, 0.45);
    }

    .btn-auth-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-alert {
      display: none;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <img src="./Logotipo do aplicativo.png" alt="Grupo Oliveira" class="auth-logo" onerror="this.src='./assets/img/brand/icon-192.png'">
      </div>

      <h1 class="auth-title">Criar Conta no Clube</h1>
      <p class="auth-subtitle">Cadastro único válido em todas as 6 unidades do Grupo Oliveira</p>

      <!-- ORIGEM PRESERVADA -->
      <div id="origin-badge" class="station-origin-badge">
        <span style="font-size:18px">📍</span>
        <div style="flex:1;line-height:1.3">
          <div style="font-size:11px;color:#94a3b8">Unidade de Cadastro:</div>
          <b id="origin-station-name">Posto Marcos Zagury (Matriz)</b>
        </div>
      </div>

      <!-- ALERTA DE FEEDBACK -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="form-cadastro" onsubmit="handleCadastro(event)">
        <div class="form-group">
          <label for="cad-name" class="form-label">Nome Completo *</label>
          <div class="input-wrapper">
            <input type="text" id="cad-name" name="name" required class="auth-input" placeholder="Ex.: Lucas Albuquerque">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cad-cpf" class="form-label">CPF *</label>
            <div class="input-wrapper">
              <input type="text" id="cad-cpf" name="cpf" required class="auth-input" placeholder="000.000.000-00" maxlength="14" oninput="maskCPF(this)">
            </div>
          </div>
          <div class="form-group">
            <label for="cad-phone" class="form-label">Celular / WhatsApp *</label>
            <div class="input-wrapper">
              <input type="tel" id="cad-phone" name="phone" required class="auth-input" placeholder="(92) 99999-9999" maxlength="15" oninput="maskPhone(this)">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="cad-email" class="form-label">E-mail *</label>
          <div class="input-wrapper">
            <input type="email" id="cad-email" name="email" required class="auth-input" placeholder="seuemail@exemplo.com" autocomplete="email">
          </div>
        </div>

        <!-- REQUISITO 1: CRIAR SENHA (MÍNIMO 8 CARACTERES + TOGGLE) -->
        <div class="form-group">
          <label for="cad-password" class="form-label">Criar Senha *</label>
          <div class="input-wrapper">
            <input type="password" id="cad-password" name="password" required minlength="8" class="auth-input has-toggle" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cad-password', this)" aria-label="Mostrar ou ocultar senha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-hint">
            <span>🔒</span> A senha deve conter no mínimo 8 caracteres.
          </div>
        </div>

        <!-- REQUISITO 1: CONFIRMAR SENHA (+ TOGGLE E VALIDAÇÃO) -->
        <div class="form-group">
          <label for="cad-confirm-password" class="form-label">Confirmar Senha *</label>
          <div class="input-wrapper">
            <input type="password" id="cad-confirm-password" name="confirmPassword" required minlength="8" class="auth-input has-toggle" placeholder="Repita a senha criada" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cad-confirm-password', this)" aria-label="Mostrar ou ocultar senha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- DADOS DO VEÍCULO (OPCIONAIS) -->
        <div class="form-row">
          <div class="form-group">
            <label for="cad-vehicle" class="form-label">Modelo do Veículo</label>
            <div class="input-wrapper">
              <input type="text" id="cad-vehicle" name="vehicle" class="auth-input" placeholder="Ex.: Onix 1.0">
            </div>
          </div>
          <div class="form-group">
            <label for="cad-plate" class="form-label">Placa</label>
            <div class="input-wrapper">
              <input type="text" id="cad-plate" name="plate" class="auth-input" placeholder="ABC-1234" maxlength="8" style="text-transform:uppercase">
            </div>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-auth-submit">
          <span>CONCLUIR CADASTRO</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Já tem uma conta no Clube?
        <a href="/login">Fazer Login</a>
      </div>
    </div>
  </div>

  <!-- SUPABASE JS BUNDLE -->
  <script src="./assets/js/supabase.js"></script>

  <script>
    const STATION_NAMES = {
      'posto-01': 'Posto Marcos Zagury (Matriz - Parintins)',
      'matriz-parintins': 'Posto Marcos Zagury (Matriz - Parintins)',
      'posto-02': 'Posto Grupo Oliveira Barreirinha',
      'posto-barreirinha': 'Posto Grupo Oliveira Barreirinha',
      'posto-03': 'Posto Grupo Oliveira Nhamundá',
      'posto-nhamunda': 'Posto Grupo Oliveira Nhamundá',
      'posto-04': 'Posto Grupo Oliveira Terra Santa',
      'posto-terrasanta': 'Posto Grupo Oliveira Terra Santa',
      'posto-05': 'Posto Fluvial Grupo Oliveira',
      'posto-fluvial': 'Posto Fluvial Grupo Oliveira',
      'posto-06': 'Posto Oliveira Express',
      'posto-express': 'Posto Oliveira Express'
    };

    let supabaseClient = null;
    let originStationId = 'matriz-parintins';

    async function initSupabase() {
      try {
        const res = await fetch('/api/auth/config');
        if (res.ok) {
          const config = await res.json();
          if (config.supabaseUrl && config.supabaseAnonKey && typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            console.log('[Supabase Auth] Conectado ao projeto:', config.supabaseUrl);
          }
        }
      } catch (e) {
        console.warn('[Supabase Auth] Modo autônomo / fallback ativo:', e.message);
      }
    }

    initSupabase();

    // Identificar e exibir posto de origem
    function checkStationOrigin() {
      const urlParams = new URLSearchParams(window.location.search);
      let ref = urlParams.get('ref') || urlParams.get('r') || localStorage.getItem('go_install_origin_id');

      if (ref) {
        ref = ref.toLowerCase().trim();
        originStationId = ref;
        const stName = STATION_NAMES[ref] || 'Posto Marcos Zagury (Matriz)';
        document.getElementById('origin-station-name').textContent = stName;
        document.getElementById('origin-badge').style.display = 'flex';
      }
    }

    checkStationOrigin();

    // Máscaras de CPF e Telefone
    function maskCPF(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      input.value = v;
    }

    function maskPhone(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
      input.value = v;
    }

    // Toggle de Mostrar/Ocultar Senha
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;

      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      btn.innerHTML = isPassword
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('auth-alert');
      alertBox.className = 'auth-alert' + (type === 'success' ? ' success' : '');
      alertBox.innerHTML = message;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('auth-alert').style.display = 'none';
    }

    // Processamento do Cadastro
    async function handleCadastro(e) {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('cad-name').value.trim();
      const cpf = document.getElementById('cad-cpf').value.trim();
      const phone = document.getElementById('cad-phone').value.trim();
      const email = document.getElementById('cad-email').value.trim().toLowerCase();
      const password = document.getElementById('cad-password').value;
      const confirmPassword = document.getElementById('cad-confirm-password').value;
      const vehicle = document.getElementById('cad-vehicle').value.trim() || 'Veículo Passeio';
      const plate = (document.getElementById('cad-plate').value.trim() || 'PLACA-GO').toUpperCase();
      const submitBtn = document.getElementById('btn-submit');

      // VALIDAÇÕES OBRIGATÓRIAS
      const cleanCPF = cpf.replace(/\D/g, '');
      if (cleanCPF.length !== 11) {
        showAlert('Por favor, informe um CPF válido com 11 dígitos.');
        return;
      }

      if (password.length < 8) {
        showAlert('A senha deve conter no mínimo 8 caracteres.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('As senhas informadas não coincidem. Por favor, digite a mesma senha nos dois campos.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner"></div><span>Criando Conta Segura...</span>`;

      try {
        // Gerar número de cartão digital exclusivo
        const part1 = '4589';
        const part2 = String(Math.floor(1000 + Math.random() * 9000));
        const part3 = String(Math.floor(1000 + Math.random() * 9000));
        const part4 = String(Math.floor(1000 + Math.random() * 9000));
        const newCardNumber = `${part1} ${part2} ${part3} ${part4}`;

        // 1. Tentar cadastro oficial no Supabase Auth
        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                name: name,
                cpf: cpf,
                phone: phone,
                cardNumber: newCardNumber,
                vehicle: vehicle,
                plate: plate,
                stationId: originStationId,
                role: 'customer' // REGRA: Cadastro público cria ESTRITAMENTE customer
              }
            }
          });

          if (error) {
            // Se já cadastrado
            if (error.message && error.message.includes('already registered')) {
              throw new Error(`Este e-mail já possui cadastro. <a href="/login" style="color:#38bdf8;font-weight:bold;text-decoration:underline">Clique aqui para entrar</a>.`);
            }
            throw error;
          }
        }

        // 2. Persistir localmente no estado da aplicação
        const savedState = JSON.parse(localStorage.getItem('grupo-oliveira-fidelidade-v2') || '{}');
        savedState.name = name;
        savedState.cardNumber = newCardNumber;
        savedState.vehicle = vehicle;
        savedState.plate = plate;
        savedState.balance = 0.00;
        savedState.points = 100; // Bônus de boas-vindas
        savedState.currentRole = 'customer';
        savedState.authSession = {
          authenticated: true,
          email: email,
          role: 'customer',
          name: name,
          loginAt: new Date().toISOString()
        };

        savedState.registeredClients = savedState.registeredClients || [];
        savedState.registeredClients.push({
          id: 'CLI-' + Math.floor(1000 + Math.random() * 9000),
          name,
          cardNumber: newCardNumber,
          phone,
          email,
          cpf,
          vehicle,
          plate,
          originStationId,
          originStationName: STATION_NAMES[originStationId] || 'Posto Marcos Zagury (Matriz)',
          registeredAt: new Date().toISOString()
        });

        localStorage.setItem('grupo-oliveira-fidelidade-v2', JSON.stringify(savedState));
        localStorage.setItem('go_current_role', 'customer');

        showAlert(`🎉 Conta criada com sucesso! Redirecionando para o seu Cartão Digital...`, 'success');

        setTimeout(() => {
          window.location.href = '/?role=customer';
        }, 800);

      } catch (err) {
        console.error('[Cadastro Error]', err);
        showAlert(err.message || 'Erro ao realizar cadastro. Tente novamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>CONCLUIR CADASTRO</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>`;
      }
    }
  </script>
</body>
</html>
